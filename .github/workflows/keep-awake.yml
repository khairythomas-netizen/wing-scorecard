name: Keep Supabase awake

# Supabase pauses a free-tier project after 7 days with no traffic, which
# takes WingZ down until someone unpauses it by hand. Until the app has real
# users generating their own traffic, this workflow is the traffic: one tiny
# read a day, well inside the window even if GitHub skips a few runs.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY is missing, so nothing was pinged."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" \
            "$URL/rest/v1/places?select=id&limit=1")
          echo "Supabase answered $code"
          # A paused project does not answer 200. Failing here turns the pause
          # into a red run and an email, instead of a silently dead app.
          [ "$code" = "200" ]
